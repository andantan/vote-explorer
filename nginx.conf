server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /explorer/ {
        proxy_pass http://blockchain-node:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
